services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: camposocial-client
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      # Pass these explicitly if they are not in .env or if you want to override
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    restart: unless-stopped
    command: pnpm dev
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
